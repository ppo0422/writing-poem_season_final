}

/* ② 사라지는 시: 꾸며 주는 말 → 동사 → 내용 말 순서로 사라져요. 마지막 판은 직접 채우기 */
function fadeTargets(L){
  const out = [];
  L.forEach((l,li)=>l.split(/\s+/).filter(Boolean).forEach((raw,wi)=>{
    const m = raw.match(/^([^A-Za-z']*)([A-Za-z'’-]+)(.*)$/);
    if(!m){ out.push({li,wi,raw,pre:raw,core:"",post:"",n:"",lvl:9}); return; }
    const n = normW(m[2]);
    let lvl = 3;
    if(FUNC_WORDS.includes(n) || n.length<2) lvl = 9;
    else if(adjSet().has(n) || /ly$/.test(n)) lvl = 1;
    else if(verbSet().has(n) || canBase(n)) lvl = 2;
    out.push({li,wi,raw,pre:m[1],core:m[2],post:m[3],n,lvl});
  }));
  return out;
}
const FADE_ROUNDS = 4; // 0 다 보임 · 1 꾸며 주는 말 · 2 + 동사 · 3 + 내용 말 · 4 직접 채우기
function studyFade(L, st){
  const F = st.fade, T = fadeTargets(L);
  const hiddenAt = r=>{ if(r<=0) return new Set(); let s = T.filter(t=>t.lvl<=r); if(!s.length && r<3) s = T.filter(t=>t.lvl<=r+1); return new Set(s); };
  const dots = h("div",{class:"fd-dots"}, ["처음","1판","2판","3판","채우기"].map((n,i)=>h("button",{type:"button",class:"fd-dot"+(i===F.round?" on":"")+(i<F.round?" past":""),onclick:()=>{ F.round=i; save(); render(); }}, n)));
  if(F.round>=FADE_ROUNDS) return h("section",{class:"panel fd"}, dots, fadeFinal(L, st, T));
  const hid = hiddenAt(F.round);
  const els = [];
  const lines = L.map((l,li)=>{
    const sp = h("span",{class:"rs",lang:"en"});
    T.filter(t=>t.li===li).forEach((t,k)=>{
      if(k) sp.append(" ");
      if(hid.has(t)){
        const b = h("button",{type:"button",class:"fw hid",title:"눌러서 잠깐 보기",onclick:ev=>{ ev.stopPropagation(); if(b.classList.contains("show")) return; F.peeks++; save(); const n=document.querySelector("#fdPeek"); if(n) n.textContent=F.peeks; b.classList.add("show"); setTimeout(()=>b.classList.remove("show"),1500); }}, t.core);
        sp.append(t.pre, b, t.post);
      } else sp.append(t.raw);
    });
    els.push(sp); return h("p",{class:"rd-line"}, sp);
  });
  const reader = readAloud(els, {listenOnly:true});
  const box = h("div",{class:"rd-poem"}, h("h3",{class:"pv-title",lang:"en"}, poemTitle()), lines);
  box.addEventListener("click",e=>{ const el=e.target.closest(".rs"); if(el && !e.target.closest(".fw")) reader.one(els.indexOf(el)); });
  const next = h("button",{class:"btn primary",type:"button",onclick:()=>{ F.round++; save(); render(); }}, F.round===0 ? "다 읽었어요 → 1판" : F.round<3 ? `다 읽었어요 → ${F.round+1}판` : "다 읽었어요 → 채우기");
  return h("section",{class:"panel fd"}, dots,
    F.round===0 ? (canSpeak ? reader.bar : null) : h("div",{class:"note"}, "빈칸을 떠올리며 소리 내어 읽어요. 막히면 빈칸을 눌러요. (본 횟수 ", h("b",{id:"fdPeek"}, String(F.peeks)), ")"),
    box, h("div",{class:"rd-ctrl"}, next));
}
function fadeFinal(L, st, T){
  const F = st.fade;
  if(S.level===1){
    /* Beginner: 빈칸을 순서대로 단어 조각으로 채워요 */
    const blanks = T.filter(t=>t.lvl<=3);
    const bank = blanks.map((t,i)=>({t,i,r:((i*7919)%97)})).sort((a,b)=>a.r-b.r);
    const used = new Set();
    for(let k=0;k<Math.min(F.tiles, blanks.length);k++){ const b = bank.find(x=>!used.has(x.i) && normW(x.t.core)===blanks[k].n); if(b) used.add(b.i); }
    const poem = h("div",{class:"rd-poem"});
    const tiles = h("div",{class:"fd-tiles"});
    const drawPoem = ()=>poem.replaceChildren(h("h3",{class:"pv-title",lang:"en"}, poemTitle()), ...L.map((l,li)=>{
      const sp = h("p",{class:"rd-line",lang:"en"});
      T.filter(t=>t.li===li).forEach((t,k)=>{ if(k) sp.append(" ");
        const bi = blanks.indexOf(t);
        if(bi<0) sp.append(t.raw);
        else sp.append(t.pre, h("span",{class:"fw slot"+(bi<F.tiles?" filled":"")+(bi===F.tiles?" cur":"")}, bi<F.tiles ? t.core : ""), t.post);
      });
      return sp;
    }));
    const drawTiles = ()=>tiles.replaceChildren(...bank.map(b=>{
      const btn = h("button",{type:"button",class:"tile",lang:"en",disabled:used.has(b.i),onclick:()=>{
        const want = blanks[F.tiles]; if(!want) return;
        if(normW(b.t.core)===want.n){ used.add(b.i); F.tiles++; save(); if(canSpeak) speak(want.core); drawPoem(); drawTiles(); drawTabs();
          if(F.tiles>=blanks.length) toast("내 시를 다 채웠어요!"); }
        else { btn.classList.add("bad"); setTimeout(()=>btn.classList.remove("bad"),500); }
      }}, b.t.core);
      return btn; }));
    drawPoem(); drawTiles();
    return h("div",{class:"fd-final"}, poem, tiles,
      h("button",{class:"btn small",type:"button",style:"justify-self:start",onclick:()=>{ F.tiles=0; save(); render(); }},"처음부터"));
  }
  const okN = L.filter(l=>F.lines[l] && F.lines[l].ok).length;
  return h("div",{class:"rw-list"},
    h("div",{class:"rw-head"}, h("b",{}, `${okN} / ${L.length}줄`), h("span",{class:"note"}, S.level===2 ? "첫 글자를 보고 내 시를 써요." : "보지 않고 내 시를 써요.")),
    L.map((l,i)=>{ const words = l.split(/\s+/).filter(Boolean).length;
      return typeCard(l, (F.lines[l] ||= {}), {prompt: h("p",{class:"rw-ko"}, `${i+1}번째 줄`, h("small",{class:"note"}, ` · ${words}단어`)), hint: S.level===2 ? "always" : "button"}); }));
}

/* ③ 듣고 받아쓰기 (Intermediate·Advanced) */
function studyDictation(L, st){
  const okN = L.filter(l=>st.dict[l] && st.dict[l].ok).length;
  return h("section",{class:"panel rw-list"},
    h("div",{class:"rw-head"}, h("b",{}, `${okN} / ${L.length}줄`)),

/* 정답 줄과 비교해 주황(거의 맞음) · 빨강(더 쓴 말) · 파랑 칸(빠진 말)으로 보여 주는 쓰기 칸 */
function typeCard(line, r, opt={}){
  r.tries ||= 0;
  const target = line.split(/\s+/).filter(Boolean), A = target.map(normW);
  const inp = h("textarea",{class:"row-in rw-in",rows:"1",lang:"en",spellcheck:"false",autocomplete:"off",autocapitalize:"off",placeholder:opt.ph||"내 시를 써요"});
  inp.value = r.last || "";
  const grow = ()=>{ inp.style.height="auto"; inp.style.height=inp.scrollHeight+"px"; };
  inp.addEventListener("keydown",e=>{ if(e.key==="Enter" && !e.isComposing){ e.preventDefault(); check(); } });
  inp.addEventListener("input",()=>{ if(/\n/.test(inp.value)) inp.value=inp.value.replace(/\s*\n\s*/g," "); grow(); r.last=inp.value; save(); });
  requestAnimationFrame(grow);
  const out = h("div",{class:"rw-out",lang:"en"}), hintEl = h("div",{class:"rw-hint",lang:"en"}), msg = h("div",{class:"rw-msg"});
  const card = h("div",{class:"rw-card"+(r.ok?" ok":"")});
  const pattern = target.map(w=>w.replace(/[A-Za-z']/g,(c,k)=> k===w.search(/[A-Za-z]/) ? c : "_")).join("  ");
  const drawHint = ()=>{
    hintEl.textContent = r.peek ? line : (opt.hint==="always" || r.hint) ? pattern : "";
    hintEl.classList.toggle("peek", !!r.peek); hintEl.hidden = !hintEl.textContent;
  };
  const sayLine = slow=>{ try{ const u=new SpeechSynthesisUtterance(line); u.lang="en-US"; u.rate=slow?0.6:0.9; speechSynthesis.cancel(); speechSynthesis.speak(u); }catch(e){} };
  const acts = h("div",{class:"rw-acts"},
    opt.listen && canSpeak ? [h("button",{class:"btn small primary",type:"button",onclick:()=>sayLine(false)},"듣기"), h("button",{class:"btn small",type:"button",onclick:()=>sayLine(true)},"천천히")] : null,
    opt.hint==="button" ? h("button",{class:"btn small",type:"button",onclick:()=>{ r.hint=1; save(); drawHint(); }},"첫 글자 힌트") : null,
    h("button",{class:"btn small",type:"button",onclick:()=>{ r.peek=true; save(); drawHint(); }},"내 시 보기"));
  function check(){
    const given = inp.value.trim(); if(!given) return;
    r.last = given; r.tries++;
    const B = given.split(/\s+/).filter(Boolean), Bn = B.map(normW);
    const ops = nearOps(alignOps(A, Bn), A, Bn), same = ops.filter(o=>o.t==="same").length;
    r.ok = ops.every(o=>o.t==="same");
    const reveal = r.tries>=2 || r.peek;
    out.replaceChildren(...ops.map(o=> o.t==="same" ? h("span",{class:"w ok"}, B[o.j])
      : o.t==="near" ? h("span",{class:"w near",title:"거의 맞았어요. 철자나 모양을 확인해요."}, B[o.j], reveal ? h("small",{}, " → "+target[o.i]) : null)
      : o.t==="extra" ? h("span",{class:"w extra",title:"내 시에 없는 말"}, B[o.j])
      : h("span",{class:"w miss",title:"빠진 말"}, reveal ? target[o.i] : "＿".repeat(Math.min(4, Math.max(2, A[o.i].length>>1))))).flatMap(x=>[x," "]));
    const has = t=>ops.some(o=>o.t===t);
    msg.textContent = r.ok ? "✓ 내 시와 똑같아요!" : `맞은 단어 ${same} / ${A.length}` + (reveal ? "" :
      [has("near") ? "주황 말은 철자·모양 고치기" : "", has("extra") ? "빨간 말은 빼기" : "", has("miss") ? "파란 칸은 빠진 말" : ""].filter(Boolean).map(x=>" · "+x).join(""));
    card.classList.toggle("ok", r.ok); save(); drawTabs();
  }
  drawHint();
  if(r.last && r.tries) setTimeout(()=>{ r.tries=Math.max(0,r.tries-1); check(); }, 0);
  card.append(opt.prompt||null, h("div",{class:"prow-in"}, inp, h("button",{class:"btn small primary",type:"button",onclick:check},"확인")), hintEl, out, msg, acts);
  return card;
}

/* ③ 읽고 녹음하기: 듣기 → 녹음 → 피드백 → 다시 읽기 */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition || null;
function studyRead(L, st){
  const els = [], words = [];
  const lineEls = L.map(l=>{
    const sp = h("span",{class:"rs",lang:"en"});
    l.split(/(\s+)/).forEach(tok=>{ if(!tok) return; if(/^\s+$/.test(tok)){ sp.append(tok); return; }
      const w = h("span",{class:"rw-w"}, tok); words.push({el:w, n:normW(tok), raw:tok}); sp.append(w); });
    els.push(sp); return h("p",{class:"rd-line"}, sp);
  });
  const reader = readAloud(els, {listenOnly:true});
  const poemBox = h("div",{class:"rd-poem"}, h("h3",{class:"pv-title",lang:"en"}, poemTitle()), lineEls);
  poemBox.addEventListener("click",e=>{
    const w = e.target.closest(".rw-w");
    if(w && poemBox.classList.contains("self")){ w.classList.toggle("miss"); drawPractice(); return; }
    const el = e.target.closest(".rs"); if(el) reader.one(els.indexOf(el));
  });
  const recBtn = h("button",{class:"btn primary rec",type:"button"}, "● 녹음하기");
  const status = h("span",{class:"ra-status"});
  const result = h("div",{class:"rd-result"});
  const practice = h("div",{class:"rd-practice"});
  const hist = h("div",{class:"rd-hist"});
  const drawHist = ()=>{
    const R = st.reads.filter(x=>x.total);
    hist.replaceChildren(...(R.length ? [h("b",{},"내 기록"), ...R.slice(-5).map((x,k,arr)=>h("span",{class:"rd-try"+(k===arr.length-1?" last":"")},
      `${st.reads.indexOf(x)+1}회 ${x.mode==="self" ? "스스로 점검" : `${x.hit}/${x.total}`}`))] : []));
  };
  const drawPractice = ()=>{
    const miss = words.filter(w=>w.el.classList.contains("miss"));
    const uniq = [...new Map(miss.map(w=>[w.n, w])).values()];
    practice.replaceChildren(...(uniq.length ? [h("b",{},"연습할 단어"), h("div",{class:"starters"}, uniq.map(w=>h("button",{class:"chip",type:"button",onclick:()=>slowSay(w.raw.replace(/[^A-Za-z' -]/g,""))}, w.raw.replace(/[.,!?;:"]+$/,""))))] : []));
  };
  let rec = null;
  const stopTracks = ()=>{ try{ rec && rec.stream && rec.stream.getTracks().forEach(t=>t.stop()); }catch(e){} };
  recCleanup = ()=>{ if(rec){ rec.active=false; try{ rec.mr && rec.mr.state!=="inactive" && rec.mr.stop(); }catch(e){} try{ rec.sr && rec.sr.abort(); }catch(e){} stopTracks(); rec=null; } recCleanup=null; };
  async function start(){
    reader.stop(); try{ speechSynthesis.cancel(); }catch(e){}
    words.forEach(w=>w.el.classList.remove("hit","miss")); poemBox.classList.remove("self");
    result.replaceChildren(); practice.replaceChildren();
    rec = {active:true, chunks:[], finals:[], interim:"", t0:Date.now(), srErr:null};
    try{
      rec.stream = await navigator.mediaDevices.getUserMedia({audio:true});
      rec.mr = new MediaRecorder(rec.stream);
      rec.mr.ondataavailable = e=>{ if(e.data && e.data.size) rec.chunks.push(e.data); };
      rec.mr.start();
    }catch(e){ rec.micErr = true; }
    if(SR){
      try{
        const r = rec.sr = new SR(); r.lang="en-US"; r.continuous=true; r.interimResults=true; r.maxAlternatives=1;
        r.onresult = e=>{ let it=""; for(let i=e.resultIndex;i<e.results.length;i++){ const t=e.results[i][0].transcript; if(e.results[i].isFinal) rec && rec.finals.push(t); else it+=t; } if(rec) rec.interim=it; };
        r.onerror = e=>{ if(rec) rec.srErr = e.error; };
        r.onend = ()=>{ if(rec && rec.active && !rec.srErr){ try{ r.start(); }catch(x){} } else if(rec && rec.srDone) rec.srDone(); };
        r.start();
      }catch(e){ rec.srErr = "start"; }
    } else rec.srErr = "none";
    if(rec.micErr && rec.srErr){ status.textContent = "마이크를 쓸 수 없어요. 마이크 사용을 허용해 주세요."; rec=null; return; }
    recBtn.textContent = "■ 다 읽었어요"; recBtn.classList.add("on");
    const tick = ()=>{ if(!rec || !rec.active) return; status.textContent = `읽는 중… ${Math.round((Date.now()-rec.t0)/1000)}초`; setTimeout(tick, 500); };
    tick();
  }
  async function stop(){
    const R = rec; if(!R) return; R.active = false;
    recBtn.disabled = true; status.textContent = "확인하는 중…";
    const sec = Math.max(1, Math.round((Date.now()-R.t0)/1000));
    const audioDone = new Promise(res=>{ if(!R.mr || R.mr.state==="inactive") return res(); R.mr.onstop = res; try{ R.mr.stop(); }catch(e){ res(); } });
    const srDone = new Promise(res=>{ if(!R.sr || R.srErr) return res(); R.srDone = res; try{ R.sr.stop(); }catch(e){ res(); } setTimeout(res, 2500); });
    await Promise.all([audioDone, srDone]);
    stopTracks(); rec = null; recCleanup = null;
    recBtn.disabled = false; recBtn.classList.remove("on"); recBtn.textContent = "● 다시 읽기";
    const audio = R.chunks.length ? h("audio",{controls:true,src:URL.createObjectURL(new Blob(R.chunks,{type:R.chunks[0].type||"audio/webm"}))}) : null;
    const said = (R.finals.join(" ")+" "+R.interim).trim();
    const auto = !R.srErr || R.srErr==="no-speech";
    if(auto && !said){
      status.textContent = "소리가 잘 들리지 않았어요. 마이크 가까이에서 다시 읽어 봐요.";
      result.replaceChildren(audio ? h("div",{class:"rd-audio"}, h("span",{},"내 목소리"), audio) : null);
      return;
    }
    if(auto){
      const ops = alignOps(words.map(w=>w.n), said.split(/\s+/).map(normW).filter(Boolean));
      const hitSet = new Set(ops.filter(o=>o.t==="same").map(o=>o.i));
      words.forEach((w,i)=>w.el.classList.add(hitSet.has(i) ? "hit" : "miss"));
      const hit = hitSet.size, total = words.length, wpm = Math.round(total/(sec/60));
      st.reads.push({mode:"auto", hit, total, sec, t:Date.now()}); save();
      const speed = wpm>170 ? "조금 천천히 읽어 봐요." : wpm<55 ? "조금 더 이어서 읽어 봐요." : "빠르기가 알맞아요.";
      const prev = st.reads.filter(x=>x.mode==="auto").slice(-2);
      const up = prev.length===2 ? prev[1].hit - prev[0].hit : null;
      status.textContent = "";
      result.replaceChildren(
        h("div",{class:"rd-score"}, h("b",{}, `${hit} / ${total}`), h("span",{}, hit===total ? "모든 단어가 또렷하게 들렸어요!" : "빨간 단어는 기계가 알아듣지 못했어요."),
          up!=null ? h("span",{class: up>0 ? "rd-up" : "note"}, up>0 ? `지난번보다 ${up}개 더!` : up===0 ? "지난번과 같아요." : "") : null),
        h("div",{class:"note"}, `${sec}초 · ${speed}`),
        audio ? h("div",{class:"rd-audio"}, h("span",{},"내 목소리"), audio) : null);
    } else {
      poemBox.classList.add("self");
      st.reads.push({mode:"self", total:words.length, sec, t:Date.now()}); save();
      status.textContent = "";
      result.replaceChildren(
        h("div",{class:"rd-score"}, h("span",{}, R.micErr ? "녹음이 되지 않았어요." : "이 기기에서는 자동 점검이 안 돼요.")),
        audio ? h("div",{class:"rd-audio"}, h("span",{},"내 목소리"), audio) : null,
        h("div",{class:"note"},"내 목소리를 듣고, 어려웠던 단어를 시에서 눌러 표시해요."));
    }
    drawPractice(); drawHist(); drawTabs();
  }
  recBtn.addEventListener("click",()=> rec ? stop() : start());
  drawHist();
  return h("section",{class:"panel rd"},
    h("div",{class:"ra-bar-wrap"}, canSpeak ? reader.bar : null),
    poemBox,
    h("div",{class:"rd-ctrl"}, recBtn, status),
    result, practice, hist);
}
function slowSay(t){ try{ const u=new SpeechSynthesisUtterance(t); u.lang="en-US"; u.rate=0.6; speechSynthesis.cancel(); speechSynthesis.speak(u); }catch(e){} }

/* ⑤ 틀린 곳 찾기: 내 시에 몰래 넣은 실수를 찾아요 (Beginner는 찾기, 나머지는 찾아서 고치기) */
function hashStr(s){ let x = 2166136261; for(const c of s){ x ^= c.charCodeAt(0); x = Math.imul(x, 16777619); } return x>>>0; }
function rng(seed){ let x = (seed>>>0) || 1; return ()=>{ x ^= x<<13; x ^= x>>>17; x ^= x<<5; return ((x>>>0)%100000)/100000; }; }
function makeErrors(L, seed, want){
  const toks = [];
  L.forEach((l,li)=>l.split(/\s+/).filter(Boolean).forEach((raw,wi)=>toks.push({li,wi,raw})));
  const R = rng(seed), C = [];
  const nounOnly = w=>DICT.some(e=>e.wl===w && e.p==="n") && !DICT.some(e=>e.wl===w && e.p==="v");
  toks.forEach((t,k)=>{
    const m = t.raw.match(/^([^A-Za-z']*)([A-Za-z'’]+)(.*)$/); if(!m) return;
    const [, pre, core, post] = m, n = core.toLowerCase().replace(/’/g,"'");
    const prev = k ? normW(toks[k-1].raw) : "", next = toks[k+1] ? normW(toks[k+1].raw) : "";
    const add = (type, wrong, why)=>{ if(wrong && wrong!==core) C.push({k, li:t.li, type, right:core, wrong, pre, post, why}); };
    if(core==="I") add("cap","i","'나'를 뜻하는 I는 항상 대문자예요.");
    if(core==="I'm" || core==="I’m") add("cap","i'm","'나'를 뜻하는 I는 항상 대문자예요.");
    if(k===0 && /^[A-Z][a-z]/.test(core)) add("cap", core[0].toLowerCase()+core.slice(1), "시의 첫 글자는 대문자로 써요.");
    if(prev==="can" && verbSet().has(n)) add("can", core+(/(s|sh|ch|x|z|o)$/.test(n)?"es":"s"), "can 다음에는 동사원형을 써요.");
    if(n==="is" && !["i","you","we","they"].includes(prev)) add("be", core[0]==="I"?"Are":"are", "하나일 때는 is를 써요.");
    if(n==="are" && ["you","we","they"].includes(prev)) add("be", core[0]==="A"?"Is":"is", `${prev} 뒤에는 are를 써요.`);
    if(n==="am") add("be", "is", "I 뒤에는 am을 써요.");
    if(n==="a" && /^[bcdfgjklmnpqrstvwxyz]/.test(next)) add("art", core[0]==="A"?"An":"an", "자음 소리 앞에서는 a를 써요.");
    if(n==="an" && /^[aeiou]/.test(next)) add("art", core[0]==="A"?"A":"a", "모음 소리 앞에서는 an을 써요.");
    if(/s$/.test(n) && n.length>3 && !/(ss|us|is)$/.test(n)){
      const cands = n.endsWith("ies") ? [n.slice(0,-3)+"y"] : n.endsWith("es") ? [n.slice(0,-2), n.slice(0,-1)] : [n.slice(0,-1)];
      const base = cands.find(nounOnly);
      if(base) add("plural", /^[A-Z]/.test(core) ? base[0].toUpperCase()+base.slice(1) : base, "여러 개일 때는 -s(-es)를 붙여요.");
    }
    if(/'/.test(n) && ["don't","can't","didn't","doesn't","isn't","it's","i'm","let's","won't","that's"].includes(n)) add("apos", core.replace(/['’]/,""), "아포스트로피(')가 빠졌어요.");
    if(n.length>=5 && !FUNC_WORDS.includes(n) && /^[a-z]+$/i.test(core)){
      for(let tries=0; tries<4; tries++){
        const i = 1 + Math.floor(R()*(core.length-3));
        const w = core.slice(0,i) + core[i+1] + core[i] + core.slice(i+2);
        if(w.toLowerCase()!==n && isKnown(w)!==true){ add("spell", w, "철자가 틀렸어요."); break; }
      }
    }
  });
  /* 종류가 고르게, 줄이 겹치지 않게 골라요 */
  const byType = {}; C.forEach(c=>(byType[c.type] ||= []).push(c));
  Object.values(byType).forEach(arr=>arr.sort(()=>R()-0.5));
  const order = Object.keys(byType).sort(()=>R()-0.5);
  const pick = [], usedK = new Set(), lineN = {};
  for(let pass=0; pass<3 && pick.length<want; pass++){
    for(const ty of order){
      if(pick.length>=want) break;
      const c = byType[ty].find(c=>!usedK.has(c.k) && (lineN[c.li]||0) <= pass && !(ty==="spell" && pick.filter(p=>p.type==="spell").length>=Math.ceil(want/2)));
      if(c){ pick.push(c); usedK.add(c.k); lineN[c.li]=(lineN[c.li]||0)+1; }
    }
  }
  pick.sort((a,b)=>a.k-b.k);
  return {toks, errs:pick};
}
function studyErr(L, st){
  const want = S.level===1 ? 3 : S.level===2 ? 4 : 5;
  const E = (st.err ||= {seed:0, found:{}, fixed:{}, misses:0, hints:0});
  const {toks, errs} = makeErrors(L, hashStr(L.join("\n")) + E.seed*7919, want);
  if(!errs.length) return h("section",{class:"panel"}, h("p",{style:"margin:0"},"이 시로는 실수를 만들기 어려워요."));
  const fixMode = S.level>1;
  const isDone = i=> fixMode ? !!E.fixed[i] : !!E.found[i];
  const allDone = ()=>errs.every((_,i)=>isDone(i));
  const status = h("div",{class:"rw-head"});
  const poem = h("div",{class:"rd-poem er-poem"});
  const fixBox = h("div",{class:"er-fix",hidden:true});
  const list = h("div",{class:"er-list"});
  const drawStatus = ()=>status.replaceChildren(h("b",{}, `찾은 실수 ${errs.filter((_,i)=>isDone(i)).length} / ${errs.length}`),
    h("span",{class:"note"}, `헛짚은 곳 ${E.misses} · 힌트 ${E.hints}`),
    h("button",{class:"btn small",type:"button",style:"margin-left:auto",onclick:hint},"힌트"));
  const drawList = ()=>list.replaceChildren(...errs.map((e,i)=>isDone(i) ? h("div",{class:"er-item"},
      h("span",{class:"er-wrong",lang:"en"}, e.wrong), " → ", h("b",{lang:"en"}, e.right), h("span",{class:"note"}, " · "+e.why)) : null),
    allDone() ? h("div",{class:"er-done"}, h("b",{},"다 찾았어요!"),
      h("button",{class:"btn small primary",type:"button",onclick:()=>{ E.seed++; E.found={}; E.fixed={}; E.misses=0; E.hints=0; save(); render(); }},"새 문제")) : null);
  const errAt = new Map(errs.map((e,i)=>[e.k, i]));
  const drawPoem = ()=>poem.replaceChildren(h("h3",{class:"pv-title",lang:"en"}, poemTitle()), ...L.map((l,li)=>{
    const p = h("p",{class:"rd-line",lang:"en","data-li":String(li)});
    toks.forEach((t,k)=>{ if(t.li!==li) return; if(t.wi) p.append(" ");
      const i = errAt.get(k), e = i!=null ? errs[i] : null;
      if(e && isDone(i)) p.append(e.pre, h("span",{class:"ew fixed"}, e.right), e.post);
      else if(e && E.found[i]) p.append(e.pre, h("button",{type:"button",class:"ew found",onclick:()=>openFix(i)}, e.wrong), e.post);
      else {
        const raw = e ? e.pre+e.wrong+e.post : t.raw;
        const b = h("button",{type:"button",class:"ew",onclick:()=>{
          if(e){ E.found[i]=true; save(); if(!fixMode){ if(canSpeak) speak(e.right); refresh(); } else { refresh(); openFix(i); } }
          else { E.misses++; save(); b.classList.add("bad"); setTimeout(()=>b.classList.remove("bad"),450); drawStatus(); }
        }}, raw);
        p.append(b);
      }
    });
    return p;
  }));
  function openFix(i){
    const e = errs[i];
    const inp = h("input",{class:"ko-in",type:"text",lang:"en",autocomplete:"off",autocapitalize:"off",spellcheck:"false",placeholder:"바르게 고쳐 써요"});
    const msg = h("span",{class:"note"});
    const ok = ()=>{
      const v = inp.value.trim().replace(/[.,!?;:]+$/,"");
      const right = e.right.replace(/[.,!?;:]+$/,"");
      const same = e.type==="cap" ? v===right : normW(v)===normW(right);
      if(same){ E.fixed[i]=true; save(); fixBox.hidden=true; if(canSpeak) speak(e.right); refresh(); }
      else { msg.textContent = normW(v)===normW(right) ? "대문자·소문자를 확인해요." : "다시 생각해 봐요."; inp.classList.add("bad"); setTimeout(()=>inp.classList.remove("bad"),450); }
    };
    inp.addEventListener("keydown",ev=>{ if(ev.key==="Enter" && !ev.isComposing){ ev.preventDefault(); ok(); } });
    fixBox.replaceChildren(h("span",{class:"er-wrong",lang:"en"}, e.wrong), h("span",{},"→"), inp, h("button",{class:"btn small primary",type:"button",onclick:ok},"고치기"), msg);
    fixBox.hidden = false;
    setTimeout(()=>{ try{ inp.focus({preventScroll:true}); }catch(x){} },0);
  }
  function hint(){
    const i = errs.findIndex((_,j)=>!E.found[j]); const j2 = i<0 ? errs.findIndex((_,j)=>!isDone(j)) : i; if(j2<0) return;
    E.hints++; save(); drawStatus();
    const line = poem.querySelector(`[data-li="${errs[j2].li}"]`); if(line){ line.classList.add("hint"); setTimeout(()=>line.classList.remove("hint"),2200); line.scrollIntoView({block:"nearest",behavior:"smooth"}); }
  }
  function refresh(){ drawPoem(); drawStatus(); drawList(); drawTabs(); if(allDone() && !E.done){ E.done = true; save(); drawTabs(); } }
  drawPoem(); drawStatus(); drawList();
  return h("section",{class:"panel er"}, status,
    h("p",{class:"note",style:"margin:0"}, fixMode ? `내 시에 실수 ${errs.length}개가 숨어 있어요. 눌러서 찾고 바르게 고쳐요.` : `내 시에 실수 ${errs.length}개가 숨어 있어요. 눌러서 찾아요.`),
    poem, fixBox, list);
}

/* ---------------- wiring ---------------- */
document.querySelectorAll(".levels button").forEach(b=>b.addEventListener("click",()=>{ if(lockedLevel) return; S.level=+b.dataset.level; save(); render(); }));
$("#nameInput").addEventListener("change",e=>switchStudent(e.target.value));
$("#nameInput").addEventListener("keydown",e=>{ if(e.key==="Enter" && !e.isComposing) e.target.blur(); });
$("#homeBtn").addEventListener("click",()=>{ S.season=null; save(); render(); });
$("#dictBtn").addEventListener("click",()=> dictOpen ? closeDict() : openDict());
document.addEventListener("keydown",e=>{ if(e.key==="Escape" && dictOpen) closeDict(); });
/* 선생님이 나눠 주는 링크: #beginner #intermediate #advanced 는 단계를 고정해요 */
let lockedLevel = 0;
function applyHash(){
  const key = (location.hash||"").replace(/^#/,"").toLowerCase();
  lockedLevel = {beginner:1, intermediate:2, advanced:3}[key] || 0;
  $(".levels").classList.toggle("locked", !!lockedLevel);
  if(lockedLevel){ S.level = lockedLevel; save(); }
}
window.addEventListener("hashchange",()=>{ applyHash(); render(); });
applyHash();
render();
